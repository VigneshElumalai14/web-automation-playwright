name: Playwright Tests
on:
  push:
    branches: [ main, stage ]
  pull_request:
    branches: [ main, stage ]
  workflow_dispatch: # Allows manually triggering the run from the GitHub Actions tab

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Install project dependencies (e.g., Playwright, Excel parsers like xlsx/exceljs)
      - name: Install dependencies
        run: npm ci

      # 4. Install Playwright browsers and operating system dependencies
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 5. Run Playwright E2E tests
      - name: Run Playwright tests
        run: npx playwright test

      # 6. Upload HTML Report artifact (runs even if tests fail)
      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
